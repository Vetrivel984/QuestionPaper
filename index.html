<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>தமிழ் வினா அணி</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="home">
    <div class="page-shell">
      <header class="hero card">
        <div>
          <p class="eyebrow">சாமக்கீர்வல் பயிற்சி</p>
          <h1>தேர்வுப் பயிற்சி</h1>
        </div>
        <button id="themeToggle" class="ghost-btn" type="button">🌙 இரவில் பார்க்க</button>
      </header>

      <main class="home-grid">
        <section class="card">
          <h2>புதிய தேர்வு தொடங்கு</h2>
          <form id="quizSetupForm" class="setup-form">
            <label>
              பாடம்
              <select id="subjectSelect" name="subject">
                <option value="all">அனைத்து பாடங்கள்</option>
              </select>
            </label>

            <label>
              வினாக்களின் எண்ணிக்கை
              <select id="questionCountSelect" name="questionCount">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>

            <label class="toggle-row">
              <input id="shuffleQuestions" type="checkbox" checked />
              <span>வினாக்களை கலக்கு</span>
            </label>

            <label class="toggle-row">
              <input id="shuffleOptions" type="checkbox" checked />
              <span>விருப்பங்களையும் கலக்கு</span>
            </label>

            <button class="primary-btn" type="submit">தேர்வைத் தொடங்கு</button>
          </form>
        </section>

        <section class="card">
          <div class="section-heading">
            <h2>முந்தைய முயற்சிகள்</h2>
            <p>சிறந்த மதிப்பெண் மற்றும் கடந்த முயற்சிகளை இங்கே பார்க்கலாம்.</p>
          </div>
          <div id="statsSummary" class="stats-summary"></div>
          <div id="attemptHistory" class="attempt-list"></div>
        </section>
      </main>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
  </body>
</html>
